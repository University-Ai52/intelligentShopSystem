<header class="bg-white border-b border-[#E0DDD2] sticky top-0 z-50">
  <div class="max-w-[1200px] mx-auto px-5 h-[62px] flex items-center">

  
    <div class="flex-1 flex justify-start">
      <a href="#" class="flex items-center gap-2 shrink-0">
        <span class="text-[25px] font-extrabold tracking-[-0.03em] text-[#141414] leading-none">
          ibuy
        </span>
      </a>
    </div>

    
    <nav class="flex-1 flex justify-center items-center gap-7 text-[13.5px] font-medium text-[#242424]">
      @for (link of links; track $index) {
        <a
          [routerLink] = "link.href"
          routerLinkActive="text-[#2952E3] font-semibold"
          class="hover:text-[#2952E3] transition-colors whitespace-nowrap"
        >
          {{ link.label }}
        </a>
      }
    </nav>


    <div class="flex-1 flex justify-end items-center gap-5 text-[13.5px] font-medium">

      <div class="flex justify-center">
        <input
          type="text"
          placeholder="Search products..."
          class="w-[230px] bg-white border border-[#C9C6BA] rounded-[3px] px-3 py-[7px] text-[12.5px] focus:outline-none focus:border-[#2952E3]"
        />
      </div>

      @if (isLoggedIn()) {
        <a
          href="#"
          class="text-[#2952E3] font-semibold hover:underline whitespace-nowrap"
        >
          Cart <span class="font-normal">(2)</span>
        </a>
      } @else {
        <a
          href="#"
          class="text-[#242424] hover:text-[#2952E3] transition-colors"
        >
          Login
        </a>
      }

    </div>

  </div>
</header>
